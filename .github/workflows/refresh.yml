name: Refresh Play2Day public catalog
# Install only in the dedicated public catalog repository when cloud scheduling is approved.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */8 * * *'
permissions:
  contents: write
concurrency:
  group: play2day-public-catalog-writer
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == '1Putnik/play2day-public-catalog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Open published catalog
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: published
          ref: main
      - name: Open private collector with repository-scoped deploy key
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: 1Putnik/play2day-catalog-collector
          ref: main
          path: collector
          ssh-key: ${{ secrets.COLLECTOR_DEPLOY_KEY }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare collector dependencies
        run: python -m pip install --disable-pip-version-check -q -r collector/requirements.txt
      - name: Check organizers and prepare publications
        id: collect
        shell: bash
        run: |
          set +e
          python collector/run_sync.py --public-dir published --report "$RUNNER_TEMP/source-health.json" > "$RUNNER_TEMP/collector.log" 2>&1
          rc=$?
          set -e
          case "$rc" in 0|2) ;; *) exit "$rc";; esac
          echo "result=$rc" >> "$GITHUB_OUTPUT"
      - name: Commit recoverable private state before publishing the public files
        if: steps.collect.outputs.result != ''
        working-directory: collector
        run: |
          git config user.name "Play2Day catalog updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state/catalog.json
          if ! git diff --cached --quiet; then
            git commit -qm "Update organizer catalog state"
            git push origin HEAD:refs/heads/main
          fi
      - name: Publish public documents and content-addressed posters together
        working-directory: published
        run: |
          git config user.name "Play2Day catalog updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- cruises.json parties.json
          if [ -d media ]; then git add -- media; fi
          if ! git diff --cached --quiet; then
            git commit -qm "Refresh public event listings"
            git push origin HEAD:refs/heads/main
          fi
      - name: Confirm collection result
        if: always() && steps.collect.outputs.result != ''
        run: test "${{ steps.collect.outputs.result }}" = "0"
